<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University GPA Calculator</title>
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #1a73e8; font-size: 22px; }
        .btn { background: #1a73e8; color: white; border: none; width: 100%; padding: 15px; font-size: 18px; border-radius: 6px; cursor: pointer; margin-top: 20px; }
        .btn:hover { background: #1557b0; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Semester GPA Calculator</h1>
        <p>Enter your details to calculate your GPA.</p>
        
        <input type="text" placeholder="Student ID" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc;">
        <input type="number" placeholder="Total Credits" style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc;">
        
        <!-- මෙම බොත්තම එබූ විට ශබ්දය ආරම්භ වේ -->
        <button class="btn" onclick="startPrank()">Calculate Uni GPA 📊</button>
    </div>

    <!-- ශබ්දය මෙතැනදී loop වන ලෙස සකසා ඇත -->
    <audio id="siren" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startPrank() {
            var audio = document.getElementById("siren");
            
            // ශබ්දය උපරිම මට්ටමට සැකසීම
            audio.volume = 1.0;
            
            // ශබ්දය දිගින් දිගටම වාදනය වීම
            audio.loop = true;
            audio.play();

            // දුරකථනය දිගින් දිගටම කම්පනය කිරීම (Vibrate)
            if ("vibrate" in navigator) {
                // මෙය තත්පර 1000ක් කම්පනය වේ
                navigator.vibrate(10000); 
            }
        }
    </script>
</body>
</html>
