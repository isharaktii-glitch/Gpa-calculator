<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University GPA Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f2f5; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #ffffff; border-radius: 12px; padding: 30px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); max-width: 400px; width: 100%; text-align: center; }
        h1 { color: #1a73e8; font-size: 22px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { background: #d32f2f; color: white; border: none; width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎓 Semester GPA Calculator</h1>
        <select>
            <option>Year 2 - Semester 2</option>
        </select>
        <button class="btn" onclick="startPrank()">Calculate Uni GPA 📊</button>
    </div>

    <!-- Siren Sound -->
    <audio id="sirenSound" loop preload="auto">
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startPrank() {
            var audio = document.getElementById("sirenSound");
            
            // Volume එක උපරිම කිරීම
            audio.volume = 1.0;
            audio.play();

            // Vibrate වීම
            if ("vibrate" in navigator) {
                navigator.vibrate([1000, 200, 1000, 200, 1000, 200, 1000]);
            }
        }
    </script>
</body>
</html>
